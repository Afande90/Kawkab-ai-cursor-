# Owner experiment, round 6: fold Gemma 4 E2B fine-tunes into ONE model with task-vector math (lab/brain/merge).
# Each candidate recipe is merged, converted and quantised to Q4_K_M by the SAME pipeline (c00-base is the control),
# then judged on the Kawkab exams (raw, without the guard), a 90-item set written by a separate agent (holdout3),
# Sudanese-Flores chrF and a 25-problem GSM8K check. Runs only on the brain-lab branch.
name: Brain lab 6
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  merge:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        cand: [c00-base, c01-ringg, c02-yemeni, c03-xlam, c04-ties-ry, c05-ties-ryx, c06-dare-ryx, c07-linear-ryx, c08-svd32-ryx]
    steps:
      - name: Free disk
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          # The GGUF converter needs more than the runner's 16 GB of RAM for Gemma 4's per-layer embeddings.
          sudo swapoff -a || true
          sudo fallocate -l 40G /swap40 && sudo chmod 600 /swap40 && sudo mkswap /swap40 && sudo swapon /swap40
          free -g; df -h / | tail -1
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Build llama.cpp
        run: |
          git clone --depth 1 https://github.com/ggml-org/llama.cpp
          cmake -S llama.cpp -B llama.cpp/build -DLLAMA_CURL=OFF -DCMAKE_BUILD_TYPE=Release
          cmake --build llama.cpp/build -j4 --target llama-server llama-quantize
      - name: Python packages
        run: |
          pip install -q torch --index-url https://download.pytorch.org/whl/cpu
          pip install -q -U transformers "huggingface_hub[cli]" requests numpy sentencepiece protobuf safetensors
          pip install -q -e llama.cpp/gguf-py
      - name: Download base (google/gemma-4-E2B-it) and Sudanese-Flores
        run: |
          python - <<'PY'
          from huggingface_hub import snapshot_download, hf_hub_download
          import shutil
          snapshot_download("google/gemma-4-E2B-it", local_dir="hf")
          shutil.copyfile(hf_hub_download("McGill-NLP/Sudanese_Flores", "DEVTEST.jsonl", repo_type="dataset", local_dir="dl"), "flores.jsonl")
          PY
          rm -rf dl hf/.cache; df -h / | tail -1
      - name: Merge
        run: |
          python lab/brain/merge/merge.py hf lab/brain/merge/candidates/${{ matrix.cand }}.json autopsy-${{ matrix.cand }}.json
      - name: Convert and quantise
        run: |
          python llama.cpp/convert_hf_to_gguf.py hf --outtype bf16 --use-temp-file --outfile m.bf16.gguf
          rm -rf hf
          llama.cpp/build/bin/llama-quantize m.bf16.gguf m.gguf Q4_K_M > quant.log 2>&1 || (tail -30 quant.log; exit 1)
          rm m.bf16.gguf; ls -la m.gguf
      - name: Judge
        run: |
          llama.cpp/build/bin/llama-server -m m.gguf --jinja --reasoning-budget 0 -c 8192 -np 2 -t 4 --port 8080 > server.log 2>&1 &
          for i in $(seq 180); do curl -sf localhost:8080/health && break; sleep 2; done
          c=${{ matrix.cand }}
          cd lab/brain
          export KAWKAB_PROMPT=system_prompt_v2.txt
          python exam.py $c-exam kawkab_exam.json ../../flores.jsonl ../../r-$c-exam.json
          python exam.py $c-holdout holdout_exam.json - ../../r-$c-holdout.json
          python exam.py $c-fresh2 holdout2_exam.json - ../../r-$c-fresh2.json
          python exam.py $c-fresh3 holdout3_exam.json - ../../r-$c-fresh3.json
          python merge/mathcheck.py gsm8k_sample.jsonl ../../r-$c-math.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r-${{ matrix.cand }}
          path: |
            r-*.json
            autopsy-*.json
            server.log
  report:
    needs: merge
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { path: out, merge-multiple: true }
      - name: Results
        run: |
          python - <<'PY'
          import json, glob, os
          def get(c, k):
              p = f"out/r-{c}-{k}.json"
              return json.load(open(p)) if os.path.exists(p) else None
          cands = sorted({os.path.basename(f)[2:].rsplit("-", 1)[0] for f in glob.glob("out/r-*-exam.json")})
          rows = ["Raw model, prompt v2, no guard. Search set = original 147 + held-out 60. Judges = fresh2 (60) and fresh3 (90, written by a separate agent).", "",
                  "| candidate | search set | fresh2 | fresh3 | fresh3 + guard | Sudanese chrF | GSM8K 25 | median s |", "|---|---|---|---|---|---|---|---|"]
          for c in cands:
              e, h, f2, f3, m = (get(c, k) for k in ("exam", "holdout", "fresh2", "fresh3", "math"))
              search = None
              if e and h:
                  search = (sum(r["ok"] for r in e["exam"]) + sum(r["ok"] for r in h["exam"])) / (len(e["exam"]) + len(h["exam"]))
              pct = lambda v: "-" if v is None else f"{v:.1%}"
              rows.append(f"| {c} | {pct(search)} | {pct(f2 and f2['exam_score'])} | {pct(f3 and f3['exam_score'])} | {pct(f3 and f3['exam_score_guarded'])} | "
                          f"{'-' if not e or e['sudanese_chrf'] is None else round(e['sudanese_chrf'], 1)} | {pct(m and m['gsm8k_25'])} | {e and e['exam_median_seconds']} |")
          open("RESULTS.md", "w").write("\n".join(rows) + "\n"); print("\n".join(rows))
          PY
      - name: Publish
        env: { GH_TOKEN: "${{ github.token }}" }
        run: gh release create "brain-lab6-${{ github.run_number }}" RESULTS.md out/r-*.json out/autopsy-*.json --prerelease --target "$GITHUB_SHA" --title "Brain lab 6 - merge lab" --notes-file RESULTS.md
